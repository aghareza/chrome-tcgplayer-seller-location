<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TCGPlayer Seller Location</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="popup">
    <h1>Seller Location</h1>
    <p class="summary">City and state next to each seller on TCGPlayer product pages.</p>
    <label class="toggle">
      <input type="checkbox" id="enabled" checked />
      <span class="toggle__label">Show seller locations</span>
    </label>
    <p id="status" class="status" aria-live="polite"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
